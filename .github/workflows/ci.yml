name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build erofs-utils 1.9 (Ubuntu's 1.7.1 predates the 48-bit feature)
        run: |
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config liblz4-dev liblzma-dev uuid-dev zlib1g-dev
          git clone -q --depth 1 -b v1.9 https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git /tmp/erofs-utils
          cd /tmp/erofs-utils && ./autogen.sh && ./configure --disable-fuse --enable-lzma >/dev/null && make -j"$(nproc)" >/dev/null && sudo make install >/dev/null
          fsck.erofs --help 2>&1 | head -1
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -ldflags=-s -o erofs-dedup .
      - uses: actions/upload-artifact@v4
        with:
          name: erofs-dedup-linux-amd64
          path: erofs-dedup
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: erofs-dedup
          generate_release_notes: true
